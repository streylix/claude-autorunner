<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser</title>
<meta name="game-description" content="Doomscroll without leaving the app.">
<style>
/* ============================================================================
   Browser card.

   Lives at the app root rather than in games/ for the same reason Moonlight
   does: games/ is a per-machine library, this file is source, and it is only
   half the feature. The other half — the <webview> per tab that actually
   renders the pages — is src/features/BrowserBridge.js, because a <webview>
   element only exists in the app's main frame and this card is an iframe on
   the stage.

   So everything below is chrome around a HOLE. #well is empty on purpose: it
   is measured, its rectangle is posted to the host, and the host floats the
   active tab over exactly that spot. Anything drawn inside it would sit
   underneath a live web page and never be seen.

   The palette mirrors the app's tokens, and light is stated twice — once for
   "the OS says light and the host has not pinned a theme", once for "the host
   pinned light" — the same convention the other cards use.
   ========================================================================= */
:root{
  --bg-primary:#1a1a1e;
  --bg-secondary:#121214;
  --bg-tertiary:#222228;
  --bg-hover:#2a2a32;
  --text-primary:#e8e8ed;
  --text-secondary:#a0a0ab;
  --text-tertiary:#70707c;
  --border-primary:#33333c;
  --border-secondary:#44444f;
  --accent:#4f8ff7;
  --error:#f87171;
  --radius:8px;
}

@media (prefers-color-scheme: light){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg-primary:#eff1f5;
    --bg-secondary:#e6e9ef;
    --bg-tertiary:#dce0e8;
    --bg-hover:#ccd0da;
    --text-primary:#4c4f69;
    --text-secondary:#5c5f77;
    --text-tertiary:#8c8fa1;
    --border-primary:#dce0e8;
    --border-secondary:#ccd0da;
    --accent:#1e66f5;
    --error:#d20f39;
  }
}
:root[data-theme="light"]{
  --bg-primary:#eff1f5;
  --bg-secondary:#e6e9ef;
  --bg-tertiary:#dce0e8;
  --bg-hover:#ccd0da;
  --text-primary:#4c4f69;
  --text-secondary:#5c5f77;
  --text-tertiary:#8c8fa1;
  --border-primary:#dce0e8;
  --border-secondary:#ccd0da;
  --accent:#1e66f5;
  --error:#d20f39;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg-primary);
  color:var(--text-primary);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- the tab strip ---------- */
/* Above the address bar, browser-shaped: the active tab is the one that shares
   its background with the page area below it, so the strip reads as depth
   rather than as a row of buttons. */

.strip{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:2px;
  padding:5px 6px 0;
  background:var(--bg-secondary);
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none;}

.tab{
  /* `width` is stated because the shared button rule below sizes every button
     to a 26px square, which as a flex-basis collapsed these to a stub. */
  width:auto;
  flex:1 1 0;
  min-width:52px;
  max-width:140px;
  display:flex;
  align-items:center;
  gap:5px;
  height:26px;
  padding:0 4px 0 9px;
  font:inherit;
  font-size:11.5px;
  color:var(--text-tertiary);
  background:transparent;
  border:1px solid transparent;
  border-bottom:none;
  border-radius:7px 7px 0 0;
  cursor:pointer;
  transition:background .12s,color .12s;
}
.tab:hover{background:var(--bg-tertiary);color:var(--text-secondary);}
.tab.active{
  background:var(--bg-primary);
  border-color:var(--border-primary);
  color:var(--text-primary);
}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

.tab-title{
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:left;
}

/* A loading tab pulses where its close button would be, so the strip never
   changes width just because a page started loading. */
.tab-dot{
  flex:0 0 auto;
  width:6px;
  height:6px;
  margin:0 4px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.25;}}

.tab-x{
  flex:0 0 auto;
  width:15px;
  height:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  font-size:13px;
  line-height:1;
  color:var(--text-tertiary);
  opacity:0;
}
.tab:hover .tab-x,.tab.active .tab-x{opacity:1;}
.tab-x:hover{background:var(--bg-hover);color:var(--text-primary);}
/* One tab left: closing it would only reopen the home page, so don't offer. */
.strip.single .tab-x{display:none;}

.tab-new{
  flex:0 0 auto;
  width:24px;
  height:24px;
  margin-bottom:1px;
  font-size:16px;
  line-height:1;
  color:var(--text-tertiary);
  background:transparent;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.tab-new:hover{background:var(--bg-tertiary);color:var(--text-primary);}

/* ---------- the address row ---------- */

header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:4px;
  padding:6px 7px;
  background:var(--bg-primary);
  border-bottom:1px solid var(--border-primary);
}
/* No line above the address row: the active tab shares this row's background,
   and a rule drawn under it would cut the two apart again. */

button{
  font:inherit;
  color:var(--text-secondary);
  background:transparent;
  border:none;
  border-radius:6px;
  padding:0;
  width:26px;
  height:26px;
  flex:0 0 auto;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .12s,color .12s,opacity .12s;
}
button:hover:not(:disabled){background:var(--bg-hover);color:var(--text-primary);}
button:disabled{opacity:.3;cursor:default;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

#url{
  flex:1 1 auto;
  min-width:0;
  font:inherit;
  font-size:12px;
  color:var(--text-primary);
  background:var(--bg-tertiary);
  border:1px solid transparent;
  border-radius:99px;
  padding:5px 11px;
  outline:none;
  text-overflow:ellipsis;
}
#url:hover{background:var(--bg-hover);}
#url:focus{background:var(--bg-secondary);border-color:var(--accent);text-overflow:clip;}
#url::placeholder{color:var(--text-tertiary);}

/* Loading is a hairline under the chrome rather than a spinner — at this width
   a spinner would have to steal a button's worth of space. */
.bar{flex:0 0 auto;height:2px;background:transparent;overflow:hidden;}
.bar.on::after{
  content:"";
  display:block;
  height:100%;
  width:40%;
  background:var(--accent);
  animation:slide 1.1s ease-in-out infinite;
}
@keyframes slide{
  0%{transform:translateX(-100%);}
  100%{transform:translateX(350%);}
}

/* ---------- the hole ---------- */

#well{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  background:var(--bg-primary);
}
/* Only ever visible before the host floats a page over this area, or if the
   card is opened somewhere that has no host to talk to. */
#idle{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:16px;
  text-align:center;
  color:var(--text-tertiary);
  font-size:12px;
}
#idle b{color:var(--text-secondary);font-weight:600;font-size:13px;}
#idle.gone{display:none;}

/* ---------- the menu ---------- */

.menu-wrap{position:relative;flex:0 0 auto;}
.menu{
  position:absolute;
  top:30px;
  right:0;
  z-index:5;
  display:none;
  flex-direction:column;
  min-width:180px;
  padding:4px;
  background:var(--bg-tertiary);
  border:1px solid var(--border-secondary);
  border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.menu.open{display:flex;}
.menu button{
  width:100%;
  height:auto;
  justify-content:flex-start;
  padding:6px 8px;
  font-size:12px;
  color:var(--text-primary);
  text-align:left;
}
.menu .danger{color:var(--error);}

/* ---------- thumbnail mode ---------- */
/* Cards in the rail are ~150px wide live renders. A browser at that size is
   both illegible and a second copy of a page nobody asked to load, so the
   thumbnail paints a poster and never talks to the host. */
body.thumb{align-items:center;justify-content:center;}
body.thumb .strip,body.thumb header,body.thumb #well,body.thumb .bar{display:none;}
.poster{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:10px;
  color:var(--text-secondary);
}
body.thumb .poster{display:flex;}
.poster .glyph{font-size:52px;line-height:1;}
.poster .word{font-size:20px;font-weight:600;letter-spacing:.5px;color:var(--text-primary);}
</style>
</head>
<body>

<div class="poster" aria-hidden="true">
  <div class="glyph">🌐</div>
  <div class="word">Browser</div>
</div>

<div class="strip" id="strip" role="tablist" aria-label="Tabs">
  <button class="tab-new" id="new-tab" title="New tab" aria-label="New tab">+</button>
</div>

<header>
  <button id="back" title="Back" disabled aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button id="forward" title="Forward" disabled aria-label="Forward">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button id="reload" title="Reload" aria-label="Reload">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.6M20 5v6h-6"/></svg>
  </button>

  <input id="url" type="text" spellcheck="false" autocomplete="off"
         placeholder="Search or type a link" aria-label="Address">

  <div class="menu-wrap">
    <button id="menu-btn" title="More" aria-label="More" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="menu" id="menu" role="menu">
      <button id="ua-toggle" role="menuitem">Request desktop site</button>
      <button id="clear" class="danger" role="menuitem">Clear cookies &amp; sign out</button>
    </div>
  </div>
</header>

<div class="bar" id="bar"></div>

<main id="well">
  <div id="idle">
    <b>Browser</b>
    <span id="idle-note">Starting…</span>
  </div>
</main>

<script>
/* ============================================================================
   Host protocol — MoonlightBridge's, verbatim in shape.

   `file://` frames each get an opaque origin, so the host cannot identify this
   card by comparing window references. Instead it posts a token TO THE STAGE
   FRAME. Asking for one is free; receiving one is only possible if you are the
   card on the stage. Every op after that carries it.
   ========================================================================= */
const TIMEOUT_MS = 8000;
const HANDSHAKE_TIMEOUT_MS = 3000;

const PENDING = new Map();
let nextId = 1;
let token = null;
let waiting = null;
let onWelcome = () => {};

/* The last snapshot the host sent: every tab, which one is in front, and
   whether we are asking sites for their mobile layout. */
let snap = { tabs: [], activeId: null, mobile: true };
let home = "https://www.instagram.com/";
let editing = false;   // the address bar has focus: leave what is typed alone
let confirming = false;

const $ = (id) => document.getElementById(id);

function handshake(){
  if (token) return Promise.resolve(token);
  if (waiting) return waiting;

  waiting = new Promise((resolve, reject) => {
    let attempts = 0;
    let timer = null;
    const finish = () => { clearTimeout(timer); waiting = null; resolve(token); };
    const ask = () => {
      if (token){ finish(); return; }
      if (++attempts > 3){
        waiting = null;
        reject(new Error("The app did not answer. Is this card open on the stage?"));
        return;
      }
      parent.postMessage({ source:"browser", op:"handshake" }, "*");
      timer = setTimeout(ask, HANDSHAKE_TIMEOUT_MS / 3);
    };
    onWelcome = finish;
    ask();
  });

  return waiting;
}

async function call(op, args = {}){
  await handshake();

  const send = () => new Promise((resolve, reject) => {
    const id = `b${nextId++}`;
    const timer = setTimeout(() => {
      PENDING.delete(id);
      reject(new Error("The app did not answer."));
    }, TIMEOUT_MS);
    PENDING.set(id, { resolve, reject, timer });
    parent.postMessage({ source:"browser", id, op, token, args }, "*");
  });

  try{
    return await send();
  }catch(err){
    // The token rotates whenever the card reloads, so one stale reply after a
    // hot reload is expected rather than an error worth showing.
    if (!err.stale) throw err;
    token = null;
    await handshake();
    return send();
  }
}

window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m) return;

  if (m.source === "vibe-blast-host" && m.op === "theme"){ applyTheme(m.theme); return; }
  if (m.source !== "browser-host") return;

  if (m.op === "welcome"){
    token = m.token;
    if (m.home) home = m.home;
    onWelcome();
    return;
  }

  if (!m.id){
    if (m.event === "tabs") render(m.payload);
    if (m.event === "error") note(m.message || "This page did not load.");
    return;
  }

  const pending = PENDING.get(m.id);
  if (!pending) return;
  PENDING.delete(m.id);
  clearTimeout(pending.timer);

  if (m.ok){
    pending.resolve(m.result);
  }else{
    const err = new Error(m.error || "request failed");
    err.stale = !!m.stale;
    pending.reject(err);
  }
});

function applyTheme(theme){
  if (theme === "light" || theme === "dark"){
    document.documentElement.setAttribute("data-theme", theme);
  }else{
    document.documentElement.removeAttribute("data-theme");
  }
}

/* ============================================================================
   The hole.

   #well is measured in THIS frame's coordinates and posted up; the host adds
   the stage's own offset and floats the page there. Sent whenever the layout
   could have moved it — which from in here means a resize, since the panel
   sliding or the window moving changes the stage's offset, not ours, and the
   host recomputes that itself every frame.
   ========================================================================= */
let lastRect = null;

function place(force){
  const r = $("well").getBoundingClientRect();
  const rect = {
    x: Math.round(r.left), y: Math.round(r.top),
    w: Math.round(r.width), h: Math.round(r.height)
  };
  if (!force && lastRect
      && lastRect.x === rect.x && lastRect.y === rect.y
      && lastRect.w === rect.w && lastRect.h === rect.h) return;
  lastRect = rect;
  call("place", { rect })
    .then((s) => { render(s); $("idle").classList.add("gone"); })
    .catch((err) => note(err.message));
}

function note(message){
  $("idle").classList.remove("gone");
  $("idle-note").textContent = message;
}

/* ============================================================================
   Chrome
   ========================================================================= */

function activeTab(){
  return snap.tabs.find((t) => t.active) || snap.tabs[0] || null;
}

/** What the address bar does with whatever was typed into it. */
function toUrl(text){
  const t = (text || "").trim();
  if (!t) return null;
  if (/^https?:\/\//i.test(t)) return t;
  if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(t) && !/\s/.test(t)) return "https://" + t;
  return "https://www.google.com/search?q=" + encodeURIComponent(t);
}

function go(url){
  call("navigate", { url }).then(render).catch((err) => note(err.message));
}

/** Hostname-first, scheme dropped: the bar is ~180px wide and the scheme is
 *  the least useful 8 characters in it. The full URL comes back on focus. */
function display(url){
  if (!url) return "";
  try{
    const u = new URL(url);
    const path = (u.pathname === "/" ? "" : u.pathname) + u.search;
    return u.hostname.replace(/^www\./, "") + path;
  }catch(_){
    return url;
  }
}

/** A tab is labelled by its page title, and by its host until one arrives —
 *  "instagram.com" is a better placeholder than an empty pill. */
function label(tab){
  if (tab.title) return tab.title;
  try{
    return new URL(tab.url).hostname.replace(/^(www|m)\./, "");
  }catch(_){
    return "New tab";
  }
}

/* Tabs are keyed and reused rather than rebuilt: the strip scrolls, and a
   rebuild on every state push (which includes every loading flip) would throw
   away its scroll position and the hover you were about to click. */
const TABS = new Map();

function renderStrip(){
  const strip = $("strip");
  const seen = new Set();

  snap.tabs.forEach((tab, index) => {
    seen.add(tab.id);
    let entry = TABS.get(tab.id);

    if (!entry){
      const el = document.createElement("button");
      el.className = "tab";
      el.setAttribute("role", "tab");

      const title = document.createElement("span");
      title.className = "tab-title";

      const close = document.createElement("span");
      close.className = "tab-x";
      close.textContent = "×";
      close.title = "Close tab";

      el.append(title, close);
      el.addEventListener("click", (e) => {
        if (e.target === close){
          e.stopPropagation();
          call("close-tab", { id: tab.id }).then(render).catch(() => {});
          return;
        }
        call("activate", { id: tab.id }).then((s) => {
          render(s);
          call("focus").catch(() => {});
        }).catch(() => {});
      });
      // Middle-click closes, the way it does everywhere else.
      el.addEventListener("auxclick", (e) => {
        if (e.button !== 1) return;
        call("close-tab", { id: tab.id }).then(render).catch(() => {});
      });

      entry = { el, title, close, dot: null };
      TABS.set(tab.id, entry);
      strip.appendChild(el);
    }

    const text = label(tab);
    if (entry.title.textContent !== text) entry.title.textContent = text;
    entry.el.title = tab.title ? `${tab.title}\n${tab.url}` : tab.url;
    entry.el.classList.toggle("active", !!tab.active);
    entry.el.setAttribute("aria-selected", tab.active ? "true" : "false");
    entry.el.style.order = String(index);

    // Loading swaps the close button for a pulse in the same slot.
    if (tab.loading && !entry.dot){
      entry.dot = document.createElement("span");
      entry.dot.className = "tab-dot";
      entry.el.replaceChild(entry.dot, entry.close);
    }else if (!tab.loading && entry.dot){
      entry.el.replaceChild(entry.close, entry.dot);
      entry.dot = null;
    }
  });

  for (const [id, entry] of TABS){
    if (seen.has(id)) continue;
    entry.el.remove();
    TABS.delete(id);
  }

  strip.classList.toggle("single", snap.tabs.length < 2);
  $("new-tab").style.order = String(snap.tabs.length + 1);

  const active = TABS.get(snap.activeId);
  if (active) active.el.scrollIntoView({ block:"nearest", inline:"nearest" });
}

function render(next){
  if (!next || !Array.isArray(next.tabs)) return;
  snap = next;

  renderStrip();

  const tab = activeTab() || { url:"", title:"", loading:false, back:false, forward:false };

  $("back").disabled = !tab.back;
  $("forward").disabled = !tab.forward;
  $("bar").classList.toggle("on", !!tab.loading);

  $("reload").title = tab.loading ? "Stop" : "Reload";
  $("reload").innerHTML = tab.loading
    ? '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.6M20 5v6h-6"/></svg>';

  if (!editing) $("url").value = display(tab.url);
  $("url").title = tab.title ? `${tab.title}\n${tab.url}` : tab.url;

  $("ua-toggle").textContent = snap.mobile ? "Request desktop site" : "Request mobile site";
}

function closeMenu(){
  $("menu").classList.remove("open");
  $("menu-btn").setAttribute("aria-expanded", "false");
  confirming = false;
  $("clear").textContent = "Clear cookies & sign out";
}

function bind(){
  $("back").addEventListener("click", () => call("back").then(render).catch(() => {}));
  $("forward").addEventListener("click", () => call("forward").then(render).catch(() => {}));
  $("reload").addEventListener("click", () => {
    const tab = activeTab();
    call(tab && tab.loading ? "stop" : "reload").then(render).catch(() => {});
  });

  $("new-tab").addEventListener("click", () => {
    call("new-tab", { url: home }).then((s) => {
      render(s);
      // A new tab is usually the start of typing somewhere.
      $("url").focus();
    }).catch((err) => note(err.message));
  });

  const url = $("url");
  url.addEventListener("focus", () => {
    editing = true;
    const tab = activeTab();
    url.value = tab ? tab.url : "";
    url.select();
  });
  url.addEventListener("blur", () => {
    editing = false;
    const tab = activeTab();
    url.value = display(tab ? tab.url : "");
  });
  url.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){
      const target = toUrl(url.value);
      if (target) go(target);
      url.blur();
      // Focus belongs to the page the moment it is asked for, or the first
      // scroll goes to the address bar instead of the feed.
      call("focus").catch(() => {});
    }else if (e.key === "Escape"){
      const tab = activeTab();
      url.value = display(tab ? tab.url : "");
      url.blur();
    }
  });

  $("menu-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    const open = $("menu").classList.toggle("open");
    $("menu-btn").setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) closeMenu();
  });
  document.addEventListener("click", () => closeMenu());
  $("menu").addEventListener("click", (e) => e.stopPropagation());

  $("ua-toggle").addEventListener("click", () => {
    call("ua", { mode: snap.mobile ? "desktop" : "mobile" }).then(render).catch(() => {});
    closeMenu();
  });

  // Two taps: this throws away every login in the card, and the menu is one
  // slip away from the reload button.
  $("clear").addEventListener("click", () => {
    if (!confirming){
      confirming = true;
      $("clear").textContent = "Really? Everything signs out";
      return;
    }
    call("clear").then(render).catch((err) => note(err.message));
    closeMenu();
  });

  // The well only changes size when the panel does; the host tracks everything
  // else. `place` is idempotent, so a spurious call costs nothing.
  if (typeof ResizeObserver !== "undefined"){
    new ResizeObserver(() => place(false)).observe($("well"));
  }
  window.addEventListener("resize", () => place(false));
}

/* Thumbnail frames get the poster and nothing else — no host, no page load.
   GamesManager marks them with ?thumb=<mtime>; the stage gets ?v=<mtime>. */
if (new URLSearchParams(location.search).has("thumb")){
  document.body.classList.add("thumb");
}else{
  bind();
  note("Starting…");
  place(true);
}
</script>
</body>
</html>
